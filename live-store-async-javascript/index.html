<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Store - Async JavaScript</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>Live Store</h1>
      <p>Async JavaScript • REST API • Local Storage</p>
    </div>
    <div class="cart">Cart: <span id="cart-count">0</span></div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search-input" type="search" placeholder="Search products..." aria-label="Search products">
      <select id="sort-select" aria-label="Sort products">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Rating: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
      </select>
    </section>

    <div id="category-tabs" class="tabs"></div>
    <div id="error-banner" class="error-banner" hidden></div>
    <div id="loading" class="grid" hidden></div>
    <section id="product-grid" class="grid" aria-live="polite"></section>
    <p id="empty-state" class="empty" hidden>No products match your search.</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
